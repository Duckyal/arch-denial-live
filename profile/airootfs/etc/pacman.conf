[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 16

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist

# Denial 桌面官方仓库（HTTPS，签名可选）
[denial]
SigLevel = Optional TrustAll
Server = https://denialwm.github.io/denial/$arch
