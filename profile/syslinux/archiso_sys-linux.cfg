LABEL arch
TEXT HELP
Boot Arch + Denial Rescue Live (BIOS).
Installs offline/online, fixes Windows/Linux boot.
ENDTEXT
MENU LABEL Boot Rescue Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%


LABEL archverbose
TEXT HELP
Boot with full kernel logs (no quiet) for debugging.
ENDTEXT
MENU LABEL Full Boot Log (verbose)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% loglevel=7 %KERNEL_PARAMS%

LABEL archpersist
TEXT HELP
Boot with persistent changes saved to CASPER_RW partition.
Requires persist-make once to create the partition.
ENDTEXT
MENU LABEL Persistent Mode (CASPER_RW)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_label=CASPER_RW cow_spacesize=2G archpersist %KERNEL_PARAMS%
