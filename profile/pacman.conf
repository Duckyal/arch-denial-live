[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Never
LocalFileSigLevel = Never
ParallelDownloads = 16
CacheDir = /build/paccache

[core]
Server = file:///build/repo/core/os/$arch

[extra]
Server = file:///build/repo/extra/os/$arch

[denial]
Server = file:///build/repo/denial/os/$arch
