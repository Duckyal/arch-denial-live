name: check-updates-and-build
on:
  schedule:
    # 每小时第 17 分检查一次上游（避开整点拥堵）；有更新才构建
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略版本检查，强制构建'
        type: boolean
        default: false
  push:
    paths:
      - 'profile/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: 刷新 Arch 同步库并比对 packages.lock
        id: cmp
        run: |
          # 在 arch 容器里读同步库（ubuntu runner 没有 pacman）
          docker run --rm -v "$PWD":/build -w /build archlinux/archlinux:latest bash -c '
            sed -i "s/^#Server = https:\/\/geo/Server = https:\/\/geo/" /etc/pacman.d/mirrorlist
            pacman -Sy --noconfirm >/dev/null
            bash scripts/check-updates.sh' && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
      - name: 提交锁文件更新
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.lock
          git commit -m "chore: 上游包版本更新 $(date +%F) [skip ci]"
          git push

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 容器内构建 ISO（特权 + loop 设备）
        run: |
          set +e
          docker run --rm --privileged -v "$PWD":/build -w /build \
            archlinux/archlinux:latest bash /build/scripts/ci-build.sh 2>&1 | tee ci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "----- ci.log 尾部 60 行 -----"
            tail -60 ci.log
            ERRS=$(grep -aE "ERROR|error:|失败|No space|Killed|cannot" ci.log | tail -6 | tr '\n' ' ' | sed 's/%26/AND/g')
            echo "::error title=构建失败(rc=$rc)::${ERRS:-见日志尾部}"
            exit "$rc"
          fi
      - name: 发布前检查
        run: |
          set -eo pipefail
          trap 'echo "::error title=检查失败L$LINENO::$BASH_COMMAND"; tail -15 ci.log 2>/dev/null | sed "s/^/LOG: /"' ERR
          test -s release-notes.md
          ls -la out/
          echo "ISO: $(ls out/*.iso)"
      - name: 发布/更新滚动 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: "滚动构建 (rolling)"
          body_path: release-notes.md
          prerelease: false
          files: |
            out/*.iso
            out/*.sha256
          make_latest: true
      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-${{ github.run_id }}
          path: ci.log
          retention-days: 3
